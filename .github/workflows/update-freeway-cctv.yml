name: 更新國道 CCTV 資料

on:
  # 每天臺灣時間 03:40 執行（UTC 19:40）
  schedule:
    - cron: "40 19 * * *"

  # 允許在 GitHub Actions 頁面手動執行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-freeway-cctv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 安裝 XML 解析工具
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml-libxml-perl

      - name: 下載高速公路局國道 CCTV XML
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_URL="https://tisvcloud.freeway.gov.tw/history/motc20/CCTV.xml"
          TEMP_XML="$(mktemp)"

          cleanup() {
            rm -f "$TEMP_XML"
          }
          trap cleanup EXIT

          curl \
            --fail \
            --show-error \
            --location \
            --http1.1 \
            --tlsv1.2 \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --user-agent "Mozilla/5.0 GitHub-Actions Freeway-CCTV-Updater" \
            --output "$TEMP_XML" \
            "$SOURCE_URL"

          if [ ! -s "$TEMP_XML" ]; then
            echo "錯誤：下載到的 XML 是空檔案。"
            exit 1
          fi

          if ! grep -qE '<([[:alnum:]_-]+:)?CCTV([[:space:]>])' "$TEMP_XML"; then
            echo "錯誤：下載內容不像國道 CCTV XML，停止更新。"
            head -c 500 "$TEMP_XML" || true
            exit 1
          fi

          mv "$TEMP_XML" freeway-cctv.xml
          trap - EXIT

      - name: 將 XML 轉成網站使用的 JSON
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/convert-freeway-cctv.pl <<'PERL'
          use strict;
          use warnings;
          use utf8;

          use XML::LibXML;
          use JSON::PP;

          binmode STDOUT, ':encoding(UTF-8)';
          binmode STDERR, ':encoding(UTF-8)';

          my $input_file  = 'freeway-cctv.xml';
          my $output_file = 'freeway-cctv.json.tmp';

          my $parser = XML::LibXML->new(
            recover    => 0,
            no_network => 1
          );

          my $doc = eval {
            $parser->load_xml(location => $input_file);
          };

          if (!$doc) {
            die "XML 解析失敗：$@\n";
          }

          sub trim {
            my ($value) = @_;
            $value //= '';
            $value =~ s/^\s+|\s+$//g;
            return $value;
          }

          sub child_text {
            my ($node, $field_name) = @_;

            my ($field) = $node->findnodes(
              './*[local-name()="' . $field_name . '"]'
            );

            return '' if !$field;
            return trim($field->textContent);
          }

          sub first_document_text {
            my ($doc, $field_name) = @_;

            my ($field) = $doc->findnodes(
              '/*/*[local-name()="' . $field_name . '"]'
            );

            return $field ? trim($field->textContent) : '';
          }

          sub build_name {
            my ($road_name, $direction, $mile, $start, $end, $id) = @_;

            my @parts;

            push @parts, $road_name if $road_name ne '';
            push @parts, $direction if $direction ne '';
            push @parts, $mile if $mile ne '';

            if (!@parts || @parts == 1) {
              my $section = '';

              if ($start ne '' && $end ne '') {
                $section = "$start－$end";
              } elsif ($start ne '') {
                $section = $start;
              } elsif ($end ne '') {
                $section = $end;
              }

              push @parts, $section if $section ne '';
            }

            my $name = join(' ', @parts);
            return $name ne '' ? $name : "國道 CCTV $id";
          }

          my $source_update_time =
            first_document_text($doc, 'UpdateTime');

          my $update_interval =
            first_document_text($doc, 'UpdateInterval');

          my $authority_code =
            first_document_text($doc, 'AuthorityCode');

          my @cctv_nodes =
            $doc->findnodes('//*[local-name()="CCTV"]');

          if (!@cctv_nodes) {
            die "XML 中找不到 CCTV 資料，停止更新。\n";
          }

          my @cameras;
          my %seen;
          my $skipped = 0;

          for my $node (@cctv_nodes) {
            my $id = child_text($node, 'CCTVID');

            # 避免把外層包裝節點誤認為攝影機。
            next if $id eq '';

            my $sub_authority =
              child_text($node, 'SubAuthorityCode');

            my $link_id =
              child_text($node, 'LinkID');

            my $video_url =
              child_text($node, 'VideoStreamURL');

            my $location_type =
              child_text($node, 'LocationType');

            my $road_id =
              child_text($node, 'RoadID');

            my $road_name =
              child_text($node, 'RoadName');

            my $road_class =
              child_text($node, 'RoadClass');

            my $road_direction =
              child_text($node, 'RoadDirection');

            my $start =
              child_text($node, 'Start');

            my $end =
              child_text($node, 'End');

            my $location_mile =
              child_text($node, 'LocationMile');

            my $lon_text =
              child_text($node, 'PositionLon');

            my $lat_text =
              child_text($node, 'PositionLat');

            my $valid_lon =
              $lon_text =~ /^-?(?:\d+(?:\.\d+)?|\.\d+)$/;

            my $valid_lat =
              $lat_text =~ /^-?(?:\d+(?:\.\d+)?|\.\d+)$/;

            if (
              !$valid_lon ||
              !$valid_lat ||
              $video_url eq ''
            ) {
              warn "略過資料不完整的 CCTV：$id\n";
              $skipped++;
              next;
            }

            my $lon = 0 + $lon_text;
            my $lat = 0 + $lat_text;

            # 使用臺灣本島與離島周邊的寬鬆範圍。
            if (
              $lon < 118 ||
              $lon > 123.5 ||
              $lat < 21 ||
              $lat > 26.5
            ) {
              warn "略過座標超出臺灣範圍的 CCTV：$id ($lon, $lat)\n";
              $skipped++;
              next;
            }

            if ($seen{$id}++) {
              warn "略過重複的 CCTV 編號：$id\n";
              $skipped++;
              next;
            }

            my $name = build_name(
              $road_name,
              $road_direction,
              $location_mile,
              $start,
              $end,
              $id
            );

            push @cameras, {
              key              => "highway-$id",
              id               => $id,
              name             => $name,
              x                => $lon,
              y                => $lat,
              city             => '',
              district         => '',
              url              => $video_url,
              streamUrl        => $video_url,
              type             => 'highway',
              source           => '交通部高速公路局',
              subAuthorityCode => $sub_authority,
              linkId           => $link_id,
              locationType     => $location_type,
              roadId           => $road_id,
              roadName         => $road_name,
              roadClass        => $road_class,
              direction        => $road_direction,
              start            => $start,
              end              => $end,
              locationMile     => $location_mile
            };
          }

          @cameras = sort {
            $a->{id} cmp $b->{id}
          } @cameras;

          if (!@cameras) {
            die "轉換後沒有任何有效國道 CCTV，保留舊資料並停止更新。\n";
          }

          my $result = {
            metadata => {
              source               => '交通部高速公路局',
              sourceUrl            => 'https://tisvcloud.freeway.gov.tw/history/motc20/CCTV.xml',
              sourceUpdateTime     => $source_update_time,
              sourceUpdateInterval => $update_interval,
              authorityCode        => $authority_code,
              total                => scalar(@cameras),
              skipped              => $skipped
            },
            results => \@cameras
          };

          my $json = JSON::PP
            ->new
            ->utf8
            ->canonical
            ->pretty
            ->encode($result);

          open my $output, '>:raw', $output_file
            or die "無法建立 $output_file：$!\n";

          print {$output} $json;
          close $output
            or die "無法完成寫入 $output_file：$!\n";

          print "成功轉換 " . scalar(@cameras) . " 支國道 CCTV。\n";
          print "略過 $skipped 筆無效或重複資料。\n";
          PERL

          perl /tmp/convert-freeway-cctv.pl

      - name: 驗證 JSON
        shell: bash
        run: |
          set -euo pipefail

          FILE="freeway-cctv.json.tmp"

          jq empty "$FILE"

          TOTAL="$(jq '.results | length' "$FILE")"
          META_TOTAL="$(jq '.metadata.total' "$FILE")"

          if [ "$TOTAL" -le 0 ]; then
            echo "錯誤：JSON 沒有任何國道 CCTV。"
            exit 1
          fi

          if [ "$TOTAL" -ne "$META_TOTAL" ]; then
            echo "錯誤：metadata.total 與實際資料筆數不同。"
            exit 1
          fi

          INVALID_COUNT="$(
            jq '
              [
                .results[]
                | select(
                    (.key | type != "string" or length == 0) or
                    (.id | type != "string" or length == 0) or
                    (.name | type != "string" or length == 0) or
                    (.x | type != "number") or
                    (.y | type != "number") or
                    (.url | type != "string" or length == 0) or
                    (.streamUrl | type != "string" or length == 0) or
                    (.type != "highway") or
                    (.source != "交通部高速公路局")
                  )
              ]
              | length
            ' "$FILE"
          )"

          if [ "$INVALID_COUNT" -ne 0 ]; then
            echo "錯誤：發現 $INVALID_COUNT 筆欄位不完整的國道 CCTV。"
            exit 1
          fi

          DUPLICATE_COUNT="$(
            jq '
              .results
              | group_by(.key)
              | map(select(length > 1))
              | length
            ' "$FILE"
          )"

          if [ "$DUPLICATE_COUNT" -ne 0 ]; then
            echo "錯誤：發現重複的國道 CCTV key。"
            exit 1
          fi

          echo "JSON 驗證通過，共 $TOTAL 支國道 CCTV。"

      - name: 更新正式 JSON
        shell: bash
        run: |
          set -euo pipefail

          mv freeway-cctv.json.tmp freeway-cctv.json

          # XML 只作為轉換用暫存資料，不提交到專案。
          rm -f freeway-cctv.xml

      - name: 顯示更新摘要
        shell: bash
        run: |
          set -euo pipefail

          echo "資料來源：$(jq -r '.metadata.source' freeway-cctv.json)"
          echo "來源更新時間：$(jq -r '.metadata.sourceUpdateTime // "未提供"' freeway-cctv.json)"
          echo "有效 CCTV：$(jq -r '.metadata.total' freeway-cctv.json)"
          echo "略過資料：$(jq -r '.metadata.skipped' freeway-cctv.json)"

      - name: 提交更新
        shell: bash
        run: |
          set -euo pipefail

          # 必須先 git add，才能偵測第一次建立的新檔案。
          git add freeway-cctv.json

          if git diff --cached --quiet; then
            echo "國道 CCTV 資料沒有變更，不需要提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: 更新國道 CCTV 資料"
          git push
