name: 更新國道 CCTV 資料

on:
  workflow_dispatch:
    inputs:
      use_local:
        description: "不下載，直接使用專案內現有的 raw/CCTV.xml"
        type: boolean
        default: false

  schedule:
    # GitHub Actions cron 使用 UTC，因此為前一天 20:30（臺北 04:30）
    - cron: "30 20 * * *"

permissions:
  contents: write

concurrency:
  group: update-freeway-cctv
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data

    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 安裝 XML 解析工具
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml-libxml-perl

      - name: 下載國道局 CCTV 靜態資訊 XML
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.use_local }}
        shell: bash
        env:
          CCTV_XML_URL: https://tisvcloud.freeway.gov.tw/history/motc20/CCTV.xml
        run: |
          set -euo pipefail

          TMP="$(mktemp)"

          curl -fsSL \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 --max-time 180 \
            -A "taipei-cctv-updater (+https://github.com/${GITHUB_REPOSITORY})" \
            -o "$TMP" "$CCTV_XML_URL"

          if [ ! -s "$TMP" ]; then
            echo "錯誤：下載的檔案是空的。"
            exit 1
          fi

          if ! grep -qE '<([[:alnum:]_-]+:)?CCTVList([[:space:]>])' "$TMP"; then
            echo "錯誤：下載內容不是 CCTVList XML（可能是錯誤頁面）。"
            head -c 300 "$TMP"
            exit 1
          fi

          NEW_COUNT="$(grep -o '<CCTVID>' "$TMP" | wc -l)"
          OLD_COUNT=0
          if [ -f ../raw/CCTV.xml ]; then
            OLD_COUNT="$(grep -o '<CCTVID>' ../raw/CCTV.xml | wc -l)"
          fi

          echo "新檔 CCTV 數：$NEW_COUNT；現有檔：$OLD_COUNT"

          if [ "$NEW_COUNT" -le 0 ]; then
            echo "錯誤：新檔沒有任何 CCTV。"
            exit 1
          fi

          if [ "$OLD_COUNT" -gt 0 ] && [ $((NEW_COUNT * 100)) -lt $((OLD_COUNT * 70)) ]; then
            echo "錯誤：新檔筆數比現有檔少超過 30%，不覆蓋。"
            exit 1
          fi

          mkdir -p ../raw
          mv "$TMP" ../raw/CCTV.xml

      - name: 檢查 ../raw/CCTV.xml
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ../raw/CCTV.xml ]; then
            echo "錯誤：專案根目錄找不到 ../raw/CCTV.xml。"
            exit 1
          fi

          if [ ! -s ../raw/CCTV.xml ]; then
            echo "錯誤：../raw/CCTV.xml 是空檔案。"
            exit 1
          fi

          if ! grep -qE '<([[:alnum:]_-]+:)?CCTVList([[:space:]>])' ../raw/CCTV.xml; then
            echo "錯誤：../raw/CCTV.xml 格式不正確。"
            exit 1
          fi

      - name: 轉換國道 CCTV JSON
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/convert-freeway-cctv.pl <<'PERL'
          use strict;
          use warnings;
          use utf8;

          use XML::LibXML;
          use JSON::PP;

          binmode STDOUT, ':encoding(UTF-8)';
          binmode STDERR, ':encoding(UTF-8)';

          my $input_file  = '../raw/CCTV.xml';
          my $output_file = 'freeway-cctv.json.tmp';

          my $parser = XML::LibXML->new(
            recover    => 0,
            no_network => 1
          );

          my $doc = eval {
            $parser->load_xml(location => $input_file);
          };

          if (!$doc) {
            die "XML 解析失敗：$@\n";
          }

          sub trim {
            my ($value) = @_;
            $value //= '';
            $value =~ s/^\s+|\s+$//g;
            return $value;
          }

          sub child_text {
            my ($node, $field_name) = @_;

            my ($field) = $node->findnodes(
              './*[local-name()="' . $field_name . '"]'
            );

            return $field
              ? trim($field->textContent)
              : '';
          }

          sub nested_text {
            my ($node, $parent_name, $field_name) = @_;

            my ($field) = $node->findnodes(
              './*[local-name()="' . $parent_name . '"]' .
              '/*[local-name()="' . $field_name . '"]'
            );

            return $field
              ? trim($field->textContent)
              : '';
          }

          sub root_text {
            my ($doc, $field_name) = @_;

            my ($field) = $doc->findnodes(
              '/*/*[local-name()="' . $field_name . '"]'
            );

            return $field
              ? trim($field->textContent)
              : '';
          }

          sub direction_label {
            my ($direction) = @_;

            return '南向' if $direction eq 'S';
            return '北向' if $direction eq 'N';
            return '東向' if $direction eq 'E';
            return '西向' if $direction eq 'W';

            return $direction;
          }

          sub build_name {
            my (
              $road_name,
              $direction,
              $location_mile,
              $start,
              $end,
              $id
            ) = @_;

            my @parts;

            push @parts, $road_name
              if $road_name ne '';

            my $direction_text =
              direction_label($direction);

            push @parts, $direction_text
              if $direction_text ne '';

            push @parts, $location_mile
              if $location_mile ne '';

            my $section = '';

            if ($start ne '' && $end ne '') {
              $section = "$start－$end";
            } elsif ($start ne '') {
              $section = $start;
            } elsif ($end ne '') {
              $section = $end;
            }

            push @parts, $section
              if $section ne '';

            my $name = join(' ', @parts);

            return $name ne ''
              ? $name
              : "國道 CCTV $id";
          }

          my $source_update_time =
            root_text($doc, 'UpdateTime');

          my $update_interval =
            root_text($doc, 'UpdateInterval');

          my $authority_code =
            root_text($doc, 'AuthorityCode');

          my $link_version =
            root_text($doc, 'LinkVersion');

          my @nodes =
            $doc->findnodes(
              '//*[local-name()="CCTV"]'
            );

          if (!@nodes) {
            die "XML 中找不到 CCTV 資料。\n";
          }

          my @cameras;
          my %seen;
          my $skipped = 0;

          for my $node (@nodes) {
            my $id =
              child_text($node, 'CCTVID');

            next if $id eq '';

            my $sub_authority =
              child_text($node, 'SubAuthorityCode');

            my $link_id =
              child_text($node, 'LinkID');

            my $video_url =
              child_text($node, 'VideoStreamURL');

            my $location_type =
              child_text($node, 'LocationType');

            my $lon_text =
              child_text($node, 'PositionLon');

            my $lat_text =
              child_text($node, 'PositionLat');

            my $road_id =
              child_text($node, 'RoadID');

            my $road_name =
              child_text($node, 'RoadName');

            my $road_class =
              child_text($node, 'RoadClass');

            my $direction =
              child_text($node, 'RoadDirection');

            my $start =
              nested_text(
                $node,
                'RoadSection',
                'Start'
              );

            my $end =
              nested_text(
                $node,
                'RoadSection',
                'End'
              );

            my $location_mile =
              child_text($node, 'LocationMile');

            my $valid_lon =
              $lon_text =~ /^-?(?:\d+(?:\.\d+)?|\.\d+)$/;

            my $valid_lat =
              $lat_text =~ /^-?(?:\d+(?:\.\d+)?|\.\d+)$/;

            if (
              !$valid_lon ||
              !$valid_lat ||
              $video_url eq ''
            ) {
              warn "略過資料不完整的 CCTV：$id\n";
              $skipped++;
              next;
            }

            my $lon = 0 + $lon_text;
            my $lat = 0 + $lat_text;

            if (
              $lon < 118 ||
              $lon > 123.5 ||
              $lat < 21 ||
              $lat > 26.5
            ) {
              warn "略過座標超出臺灣範圍的 CCTV：$id\n";
              $skipped++;
              next;
            }

            if ($seen{$id}++) {
              warn "略過重複 CCTV：$id\n";
              $skipped++;
              next;
            }

            my $name = build_name(
              $road_name,
              $direction,
              $location_mile,
              $start,
              $end,
              $id
            );

            push @cameras, {
              key              => "highway-$id",
              id               => $id,
              name             => $name,
              x                => $lon,
              y                => $lat,
              city             => '',
              district         => '',
              url              => $video_url,
              streamUrl        => $video_url,
              type             => 'highway',
              source           => '交通部高速公路局',
              subAuthorityCode => $sub_authority,
              linkId           => $link_id,
              locationType     => $location_type,
              roadId           => $road_id,
              roadName         => $road_name,
              roadClass        => $road_class,
              direction        => $direction,
              start            => $start,
              end              => $end,
              locationMile     => $location_mile
            };
          }

          @cameras = sort {
            $a->{id} cmp $b->{id}
          } @cameras;

          if (!@cameras) {
            die "轉換後沒有任何有效國道 CCTV。\n";
          }

          my $result = {
            metadata => {
              source               => '交通部高速公路局',
              sourceFile           => '../raw/CCTV.xml',
              sourceUpdateTime     => $source_update_time,
              sourceUpdateInterval => $update_interval,
              authorityCode        => $authority_code,
              linkVersion          => $link_version,
              total                => scalar(@cameras),
              skipped              => $skipped
            },
            results => \@cameras
          };

          my $json = JSON::PP
            ->new
            ->utf8
            ->canonical
            ->pretty
            ->encode($result);

          open my $output, '>:raw', $output_file
            or die "無法建立 $output_file：$!\n";

          print {$output} $json;

          close $output
            or die "無法完成寫入 $output_file：$!\n";

          print "成功轉換 "
            . scalar(@cameras)
            . " 支國道 CCTV。\n";

          print "略過 $skipped 筆資料。\n";
          PERL

          perl /tmp/convert-freeway-cctv.pl

      - name: 驗證 freeway-cctv.json
        shell: bash
        run: |
          set -euo pipefail

          FILE="freeway-cctv.json.tmp"

          jq empty "$FILE"

          TOTAL="$(jq '.results | length' "$FILE")"
          META_TOTAL="$(jq '.metadata.total' "$FILE")"

          if [ "$TOTAL" -le 0 ]; then
            echo "錯誤：沒有任何國道 CCTV。"
            exit 1
          fi

          if [ "$TOTAL" -ne "$META_TOTAL" ]; then
            echo "錯誤：metadata.total 與實際數量不同。"
            exit 1
          fi

          INVALID_COUNT="$(
            jq '
              [
                .results[]
                | select(
                    (.key | type != "string" or length == 0) or
                    (.id | type != "string" or length == 0) or
                    (.name | type != "string" or length == 0) or
                    (.x | type != "number") or
                    (.y | type != "number") or
                    (.url | type != "string" or length == 0) or
                    (.type != "highway")
                  )
              ]
              | length
            ' "$FILE"
          )"

          if [ "$INVALID_COUNT" -ne 0 ]; then
            echo "錯誤：發現 $INVALID_COUNT 筆無效資料。"
            exit 1
          fi

          DUPLICATE_COUNT="$(
            jq '
              .results
              | group_by(.key)
              | map(select(length > 1))
              | length
            ' "$FILE"
          )"

          if [ "$DUPLICATE_COUNT" -ne 0 ]; then
            echo "錯誤：發現重複的 CCTV key。"
            exit 1
          fi

          echo "JSON 驗證成功，共 $TOTAL 支國道 CCTV。"

      - name: 更新正式 JSON
        shell: bash
        run: |
          set -euo pipefail

          mv \
            freeway-cctv.json.tmp \
            freeway-cctv.json

      - name: 顯示摘要
        shell: bash
        run: |
          set -euo pipefail

          echo "來源更新時間：$(jq -r '.metadata.sourceUpdateTime' freeway-cctv.json)"
          echo "國道 CCTV：$(jq -r '.metadata.total' freeway-cctv.json)"
          echo "略過資料：$(jq -r '.metadata.skipped' freeway-cctv.json)"

      - name: 提交國道 CCTV 資料
        shell: bash
        run: |
          set -euo pipefail

          git add freeway-cctv.json ../raw/CCTV.xml

          if git diff --cached --quiet; then
            echo "國道 CCTV 資料沒有變更。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: 更新國道 CCTV 資料"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "推送失敗，重新同步後重試（$i/3）"
            git pull --rebase origin main
          done

          echo "錯誤：推送多次失敗。"
          exit 1
