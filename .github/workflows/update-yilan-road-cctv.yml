name: 更新宜蘭道路 CCTV

on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-yilan-road-cctv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data    

    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 下載 twipcam CCTV 公開資料
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --show-error \
            --location \
            --compressed \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 8 \
            --connect-timeout 20 \
            --max-time 180 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://www.twipcam.com/api/v1/cam-list.json" \
            --output twipcam-cam-list.json

          jq -e 'type == "array" and length > 0' \
            twipcam-cam-list.json >/dev/null

      - name: 下載宜蘭警察局官方清單（失敗時使用既有配對）
        shell: bash
        run: |
          set -u

          OFFICIAL_OK="false"
          rm -f yilan-official-cams.html

          if curl \
            --fail \
            --show-error \
            --location \
            --compressed \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 120 \
            --http1.1 \
            --tlsv1.2 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36" \
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            --header "Accept-Language: zh-TW,zh;q=0.9" \
            "https://ilcpb.ivs.hinet.net/public/ilcpb_live_cam" \
            --output yilan-official-cams.html; then

            if [ -s yilan-official-cams.html ] &&
               grep -q 'hls_player?page=ilcpb&did=' \
                 yilan-official-cams.html; then
              OFFICIAL_OK="true"
            fi
          fi

          if [ "$OFFICIAL_OK" = "true" ]; then
            echo "官方清單下載成功。"
          else
            echo "::warning::宜蘭官方網站中斷 GitHub Actions 連線，本次沿用既有 officialId 與播放器網址。"
            rm -f yilan-official-cams.html
            : > yilan-official-cams.html
          fi

      - name: 產生官方攝影機對照資料
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s yilan-official-cams.html ]; then
            echo '[]' > yilan-official-cams.json
            exit 0
          fi

          perl -0777 -MJSON::PP -MEncode=decode -e '
            use strict;
            use warnings;

            my $html = decode("UTF-8", <>);
            my $category = "";
            my @results;

            while ($html =~ m{<tr\b[^>]*>(.*?)</tr>}gsi) {
              my $row = $1;
              my @cells;

              while ($row =~ m{<td\b([^>]*)>(.*?)</td>}gsi) {
                my $attrs = $1;
                my $text = $2;

                $text =~ s/<[^>]+>//g;
                $text =~ s/&nbsp;/ /g;
                $text =~ s/&amp;/&/g;
                $text =~ s/^\s+|\s+$//g;

                push @cells, {
                  attrs => $attrs,
                  text => $text
                };
              }

              next unless $row =~ m{hls_player\?page=ilcpb&did=(\d+)};
              my $did = $1;

              if (@cells && $cells[0]{attrs} =~ /rowspan/i) {
                $category = $cells[0]{text};
                shift @cells;
              }

              next unless @cells >= 2;

              my $location = $cells[0]{text};
              my $description = $cells[1]{text};
              my $clean_description = $description;

              $clean_description =~ s/^\([^)]*\)//;
              $clean_description =~ s/^\s+|\s+$//g;

              push @results, {
                category => $category,
                location => $location,
                description => $description,
                cleanName => $category . " " . $clean_description,
                did => $did,
                playerUrl =>
                  "https://ilcpb.ivs.hinet.net/public/hls_player?page=ilcpb&did=" .
                  $did
              };
            }

            print JSON::PP
              ->new
              ->utf8
              ->pretty
              ->canonical
              ->encode(\@results);
          ' yilan-official-cams.html > yilan-official-cams.json

          jq -e 'type == "array"' yilan-official-cams.json >/dev/null
          echo "官方攝影機數量：$(jq 'length' yilan-official-cams.json)"

      - name: 準備既有宜蘭資料
        shell: bash
        run: |
          set -euo pipefail

          if [ -f yilan-road-cctv.json ] &&
             jq -e '.results | type == "array"' \
               yilan-road-cctv.json >/dev/null 2>&1; then
            cp yilan-road-cctv.json /tmp/yilan-existing.json
          else
            echo '{"results":[]}' > /tmp/yilan-existing.json
          fi

      - name: 產生宜蘭道路 CCTV JSON
        shell: bash
        run: |
          set -euo pipefail

          # 官方清單有成功取得時，不在清單內的攝影機不提供播放頁連結（只提供預覽圖）；
          # 官方網站連不上時，沿用上一次已驗證過的資料
          if [ "$(jq 'length' yilan-official-cams.json)" -gt 0 ]; then
            OFFICIAL_LIST_OK=true
          else
            OFFICIAL_LIST_OK=false
          fi
          echo "官方清單可用：$OFFICIAL_LIST_OK"

          jq \
            --slurpfile official yilan-official-cams.json \
            --slurpfile existing /tmp/yilan-existing.json \
            --argjson official_ok "$OFFICIAL_LIST_OK" \
            '
            def normalize_name:
              tostring
              | gsub("^宜蘭縣道路\\s*"; "")
              | gsub("^\\([^)]*\\)"; "")
              | gsub("[[:space:]]+"; "")
              | gsub("[、，,。．・／/]"; "")
              | gsub("臺"; "台")
              | gsub("國五"; "國5")
              | gsub("台七"; "台7")
              | gsub("台九"; "台9")
              | gsub("線路口"; "線口")
              | gsub("交岔路口"; "路口")
              | gsub("交叉路口"; "路口");

            def district_from_name:
              if test("宜蘭市") then "宜蘭市"
              elif test("羅東鎮") then "羅東鎮"
              elif test("蘇澳鎮") then "蘇澳鎮"
              elif test("頭城鎮") then "頭城鎮"
              elif test("礁溪鄉") then "礁溪鄉"
              elif test("壯圍鄉") then "壯圍鄉"
              elif test("員山鄉") then "員山鄉"
              elif test("冬山鄉") then "冬山鄉"
              elif test("五結鄉") then "五結鄉"
              elif test("三星鄉") then "三星鄉"
              elif test("大同鄉") then "大同鄉"
              elif test("南澳鄉") then "南澳鄉"
              else "未判定"
              end;

            {
              results: [
                .[]
                | select((.name // "") | startswith("宜蘭縣道路 "))
                | select(
                    .id != null and
                    .lat != null and
                    .lon != null and
                    .cam_url != null
                  )
                | . as $camera

                | (
                    $official[0]
                    | map(
                        . as $officialCam
                        | ($officialCam.description | normalize_name) as $officialDescription
                        | ($camera.name | normalize_name) as $cameraName
                        | select(
                            ($cameraName == ($officialCam.cleanName | normalize_name))
                            or
                            ($cameraName | contains($officialDescription))
                          )
                        | $officialCam
                      )
                    | unique_by(.did)
                    | sort_by(.description | normalize_name | length)
                    | reverse
                    | first
                  ) as $match

                | (
                    $existing[0].results
                    | map(
                        select(
                          (.id | tostring) ==
                          ($camera.id | tostring)
                        )
                      )
                    | first
                  ) as $old

                | {
                    key: ("yilan-road-" + ($camera.id | tostring)),
                    id: ($camera.id | tostring),

                    officialId:
                      (
                        if $match then
                          ($match.did | tostring)
                        elif $official_ok == false and $old then
                          ($old.officialId // "" | tostring)
                        else
                          ""
                        end
                      ),

                    name:
                      (
                        ($camera.name | tostring)
                        | sub("^宜蘭縣道路 "; "")
                      ),

                    x: ($camera.lon | tonumber),
                    y: ($camera.lat | tonumber),
                    city: "宜蘭縣",

                    district:
                      (
                        ($camera.name | tostring)
                        | district_from_name
                      ),

                    imageUrl: ($camera.cam_url | tostring),

                    url:
                      (
                        if $match then
                          ($match.playerUrl | tostring)
                        elif (
                          $official_ok == false and
                          $old and
                          (($old.officialId // "") | tostring) != "" and
                          (($old.url // "") | tostring) != ""
                        ) then
                          ($old.url | tostring)
                        else
                          ("https://www.twipcam.com/cam/" + ($camera.id | tostring))
                        end
                      ),

                    streamUrl:
                      (
                        if $match then
                          ($match.playerUrl | tostring)
                        elif (
                          $official_ok == false and
                          $old and
                          (($old.officialId // "") | tostring) != ""
                        ) then
                          ($old.streamUrl // $old.url // "" | tostring)
                        else
                          ""
                        end
                      ),

                    type: "road",
                    source:
                      "宜蘭縣政府；經 twipcam 台灣即時影像監視器整合（CC BY 3.0 TW）"
                  }
              ]
            }
            ' twipcam-cam-list.json \
            > yilan-road-cctv.json.tmp

          jq -e '
            .results | type == "array" and length > 0
          ' yilan-road-cctv.json.tmp >/dev/null

          mv yilan-road-cctv.json.tmp yilan-road-cctv.json

      - name: 移除長時間未更新的攝影機
        shell: bash
        env:
          # 快照圖超過幾天沒更新，就視為攝影機已停止運作
          MAX_AGE_DAYS: "3"
          # 如果超過這個比例被判定為停止運作，視為檢查本身有問題，不移除任何資料
          MAX_DROP_PERCENT: "50"
        run: |
          set -euo pipefail

          NOW="$(date +%s)"
          LIMIT=$(( MAX_AGE_DAYS * 86400 ))
          TOTAL="$(jq '.results | length' yilan-road-cctv.json)"

          check_one() {
            ID="$1"
            URL="$2"

            LM="$(
              curl -sIL \
                --max-time 20 \
                --retry 2 --retry-delay 3 \
                -A "taipei-cctv-updater (+https://github.com/${GITHUB_REPOSITORY:-unknown})" \
                "$URL" 2>/dev/null \
                | tr -d '\r' \
                | grep -i '^last-modified:' \
                | tail -n 1 \
                | sed 's/^[^:]*: *//' || true
            )"

            EPOCH=""
            if [ -n "$LM" ]; then
              EPOCH="$(date -d "$LM" +%s 2>/dev/null || true)"
            fi

            printf '%s\t%s\n' "$ID" "$EPOCH"
          }
          export -f check_one
          export GITHUB_REPOSITORY

          jq -r '.results[] | [.id, .imageUrl] | @tsv' yilan-road-cctv.json \
            | xargs -P 8 -L 1 bash -c 'check_one "$0" "$1"' \
            > /tmp/yilan-lastmod.tsv

          KNOWN="$(awk -F'\t' '$2 != ""' /tmp/yilan-lastmod.tsv | wc -l)"
          STALE_IDS="$(
            awk -F'\t' -v now="$NOW" -v limit="$LIMIT" \
              '$2 != "" && (now - $2) > limit {print $1}' \
              /tmp/yilan-lastmod.tsv
          )"
          STALE="$(printf '%s' "$STALE_IDS" | grep -c . || true)"

          echo "共 $TOTAL 支；取得更新時間 $KNOWN 支；超過 ${MAX_AGE_DAYS} 天未更新 $STALE 支"

          if [ "$KNOWN" -gt 0 ]; then
            awk -F'\t' -v now="$NOW" '$2 != "" {print int((now - $2) / 86400)}' \
              /tmp/yilan-lastmod.tsv | sort -n | uniq -c \
              | awk '{print "  " $2 " 天前：" $1 " 支"}' | head -15
          fi

          if [ "$KNOWN" -eq 0 ]; then
            echo "::warning::取不到任何快照的更新時間，這次不移除任何攝影機。"
            exit 0
          fi

          if [ "$STALE" -eq 0 ]; then
            echo "沒有需要移除的攝影機。"
            exit 0
          fi

          if [ $(( STALE * 100 )) -gt $(( TOTAL * MAX_DROP_PERCENT )) ]; then
            echo "::warning::要移除的比例超過 ${MAX_DROP_PERCENT}%，可能是檢查有問題，這次不移除。"
            exit 0
          fi

          printf '%s\n' "$STALE_IDS" | jq -R . | jq -s . > /tmp/yilan-stale.json

          echo "移除的攝影機：$(jq -r 'join(", ")' /tmp/yilan-stale.json)"

          jq --slurpfile stale /tmp/yilan-stale.json \
            '.results |= map(select(.id as $id | ($stale[0] | index($id)) | not))' \
            yilan-road-cctv.json > yilan-road-cctv.json.filtered

          jq -e '.results | length > 0' yilan-road-cctv.json.filtered >/dev/null

          mv yilan-road-cctv.json.filtered yilan-road-cctv.json

      - name: 驗證宜蘭 JSON
        shell: bash
        run: |
          set -euo pipefail

          jq empty yilan-road-cctv.json

          COUNT="$(jq '.results | length' yilan-road-cctv.json)"
          MATCHED="$(
            jq '
              [
                .results[]
                | select((.officialId // "") != "")
              ]
              | length
            ' yilan-road-cctv.json
          )"

          echo "宜蘭道路 CCTV 數量：$COUNT"
          echo "具有官方播放器資料：$MATCHED"

          if [ "$COUNT" -le 0 ]; then
            echo "::error::沒有取得宜蘭道路 CCTV。"
            exit 1
          fi

      - name: 刪除暫存檔案
        shell: bash
        run: |
          rm -f twipcam-cam-list.json
          rm -f yilan-official-cams.html
          rm -f yilan-official-cams.json
          rm -f /tmp/yilan-existing.json
          rm -f /tmp/yilan-lastmod.tsv /tmp/yilan-stale.json

      - name: 提交更新
        shell: bash
        run: |
          set -euo pipefail

          git add yilan-road-cctv.json

          if git diff --cached --quiet; then
            echo "宜蘭道路 CCTV 資料沒有變更。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: 自動更新宜蘭道路 CCTV 資料"
          git push
