name: 更新高雄道路 CCTV 資料

on:
  workflow_dispatch:
    inputs:
      use_local:
        description: "不下載，直接使用專案內現有的 raw/kaohsiung-original.json"
        type: boolean
        default: false

  schedule:
    # GitHub Actions cron 使用 UTC，因此為前一天 20:40（臺北 04:40）
    - cron: "40 20 * * *"

  # 手動把新的 raw/kaohsiung-original.json 推上來時，也會自動轉換
  push:
    branches:
      - main
    paths:
      - raw/kaohsiung-original.json
      - scripts/convert-kaohsiung.js

permissions:
  contents: write

concurrency:
  group: convert-kaohsiung-cctv
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 下載高雄市 CCTV 清單
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.use_local) }}
        shell: bash
        env:
          # 範圍涵蓋整個高雄市
          CCTV_API_URL: https://traffic.tbkc.gov.tw/api/cctvs?neLat=23.5&neLng=121.1&swLat=22.3&swLng=120.0&language=zh-TW
        run: |
          set -euo pipefail

          TMP="$(mktemp)"
          OUT="$(mktemp)"
          FILE="raw/kaohsiung-original.json"

          curl -fsSL \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 --max-time 120 \
            -H "Accept: application/json" \
            -A "taipei-cctv-updater (+https://github.com/${GITHUB_REPOSITORY})" \
            -o "$TMP" "$CCTV_API_URL"

          # 清單可能直接是陣列，也可能包在 data / results / cctvs 裡；
          # 依 id 去重，並只保留有座標的資料
          jq -c '
            (if type == "array" then .
             else (.data // .results // .cctvs // []) end)
            | map(select(
                (.id | type == "string" and length > 0) and
                (.position.lat | type == "number") and
                (.position.lng | type == "number")
              ))
            | unique_by(.id)
          ' "$TMP" > "$OUT"

          NEW_COUNT="$(jq 'length' "$OUT")"
          OLD_COUNT=0
          if [ -s "$FILE" ]; then
            OLD_COUNT="$(jq 'length' "$FILE")"
          fi

          echo "下載 $NEW_COUNT 筆；現有檔 $OLD_COUNT 筆"

          if [ "$NEW_COUNT" -le 0 ]; then
            echo "::error::下載內容裡沒有可用的 CCTV，API 格式可能變了。"
            head -c 300 "$TMP"
            exit 1
          fi

          if [ "$OLD_COUNT" -gt 0 ] && [ $((NEW_COUNT * 100)) -lt $((OLD_COUNT * 70)) ]; then
            echo "::error::下載筆數比現有檔少超過 30%，不覆蓋。"
            exit 1
          fi

          mkdir -p raw
          mv "$OUT" "$FILE"

      - name: 檢查 raw/kaohsiung-original.json
        shell: bash
        run: |
          set -euo pipefail

          FILE="raw/kaohsiung-original.json"

          if [ ! -s "$FILE" ]; then
            echo "::error::找不到 $FILE，或檔案是空的。"
            exit 1
          fi

          if ! jq -e 'type == "array" and length > 0' "$FILE" >/dev/null; then
            echo "::error::$FILE 格式不正確，預期是非空的陣列。"
            exit 1
          fi

          echo "原始資料：$(jq 'length' "$FILE") 筆"

      - name: 轉換高雄道路 CCTV JSON
        shell: bash
        run: |
          set -euo pipefail

          node scripts/convert-kaohsiung.js

      - name: 驗證 kaohsiung-road-cctv.json
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/kaohsiung-road-cctv.json"

          jq empty "$FILE"

          TOTAL="$(jq '.results | length' "$FILE")"
          META_TOTAL="$(jq '.metadata.total' "$FILE")"

          if [ "$TOTAL" -le 0 ]; then
            echo "::error::轉換後沒有任何高雄 CCTV。"
            exit 1
          fi

          if [ "$TOTAL" -ne "$META_TOTAL" ]; then
            echo "::error::metadata.total 與實際數量不同。"
            exit 1
          fi

          INVALID_COUNT="$(
            jq '
              [
                .results[]
                | select(
                    (.key | type != "string" or length == 0) or
                    (.id | type != "string" or length == 0) or
                    (.name | type != "string" or length == 0) or
                    (.x | type != "number") or
                    (.y | type != "number") or
                    (.url | type != "string" or length == 0) or
                    (.x < 118 or .x > 123.5) or
                    (.y < 21 or .y > 26.5) or
                    (.type != "road")
                  )
              ]
              | length
            ' "$FILE"
          )"

          if [ "$INVALID_COUNT" -ne 0 ]; then
            echo "::error::發現 $INVALID_COUNT 筆無效資料。"
            exit 1
          fi

          DUPLICATE_COUNT="$(
            jq '
              .results
              | group_by(.key)
              | map(select(length > 1))
              | length
            ' "$FILE"
          )"

          if [ "$DUPLICATE_COUNT" -ne 0 ]; then
            echo "::error::發現重複的 CCTV key。"
            exit 1
          fi

          # 新資料比目前正式檔少超過三成，多半是原始檔不完整，先停下來
          if git cat-file -e "HEAD:$FILE" 2>/dev/null; then
            BEFORE="$(git show "HEAD:$FILE" | jq '.results | length')"

            if [ "$TOTAL" -lt $(( BEFORE * 7 / 10 )) ]; then
              echo "::error::新資料 $TOTAL 筆，目前正式檔有 $BEFORE 筆，減少超過三成，不覆蓋。"
              exit 1
            fi
          fi

          echo "JSON 驗證成功，共 $TOTAL 支高雄 CCTV。"

      - name: 提交高雄道路 CCTV 資料
        shell: bash
        run: |
          set -euo pipefail

          git add data/kaohsiung-road-cctv.json raw/kaohsiung-original.json

          if git diff --cached --quiet; then
            echo "高雄道路 CCTV JSON 沒有變更。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: 更新高雄道路 CCTV 資料"

          for ATTEMPT in 1 2 3; do
            echo "推送嘗試：$ATTEMPT"

            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "高雄道路 CCTV 資料推送成功。"
              exit 0
            fi

            sleep 10
          done

          echo "::error::重試三次後仍無法推送。"
          exit 1
