name: 由專案內 XML 產生國道 CCTV JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 安裝 XML 解析工具
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml-libxml-perl

      - name: 檢查 CCTV.xml
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f CCTV.xml ]; then
            echo "錯誤：專案根目錄找不到 CCTV.xml。"
            exit 1
          fi

          if [ ! -s CCTV.xml ]; then
            echo "錯誤：CCTV.xml 是空檔案。"
            exit 1
          fi

          if ! grep -qE '<([[:alnum:]_-]+:)?CCTVList([[:space:]>])' CCTV.xml; then
            echo "錯誤：CCTV.xml 格式不正確。"
            exit 1
          fi

      - name: 轉換國道 CCTV JSON
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/convert-freeway-cctv.pl <<'PERL'
          use strict;
          use warnings;
          use utf8;

          use XML::LibXML;
          use JSON::PP;

          binmode STDOUT, ':encoding(UTF-8)';
          binmode STDERR, ':encoding(UTF-8)';

          my $input_file  = 'CCTV.xml';
          my $output_file = 'freeway-cctv.json.tmp';

          my $parser = XML::LibXML->new(
            recover    => 0,
            no_network => 1
          );

          my $doc = eval {
            $parser->load_xml(location => $input_file);
          };

          if (!$doc) {
            die "XML 解析失敗：$@\n";
          }

          sub trim {
            my ($value) = @_;
            $value //= '';
            $value =~ s/^\s+|\s+$//g;
            return $value;
          }

          sub child_text {
            my ($node, $field_name) = @_;

            my ($field) = $node->findnodes(
              './*[local-name()="' . $field_name . '"]'
            );

            return $field
              ? trim($field->textContent)
              : '';
          }

          sub nested_text {
            my ($node, $parent_name, $field_name) = @_;

            my ($field) = $node->findnodes(
              './*[local-name()="' . $parent_name . '"]' .
              '/*[local-name()="' . $field_name . '"]'
            );

            return $field
              ? trim($field->textContent)
              : '';
          }

          sub root_text {
            my ($doc, $field_name) = @_;

            my ($field) = $doc->findnodes(
              '/*/*[local-name()="' . $field_name . '"]'
            );

            return $field
              ? trim($field->textContent)
              : '';
          }

          sub direction_label {
            my ($direction) = @_;

            return '南向' if $direction eq 'S';
            return '北向' if $direction eq 'N';
            return '東向' if $direction eq 'E';
            return '西向' if $direction eq 'W';

            return $direction;
          }

          sub build_name {
            my (
              $road_name,
              $direction,
              $location_mile,
              $start,
              $end,
              $id
            ) = @_;

            my @parts;

            push @parts, $road_name
              if $road_name ne '';

            my $direction_text =
              direction_label($direction);

            push @parts, $direction_text
              if $direction_text ne '';

            push @parts, $location_mile
              if $location_mile ne '';

            my $section = '';

            if ($start ne '' && $end ne '') {
              $section = "$start－$end";
            } elsif ($start ne '') {
              $section = $start;
            } elsif ($end ne '') {
              $section = $end;
            }

            push @parts, $section
              if $section ne '';

            my $name = join(' ', @parts);

            return $name ne ''
              ? $name
              : "國道 CCTV $id";
          }

          my $source_update_time =
            root_text($doc, 'UpdateTime');

          my $update_interval =
            root_text($doc, 'UpdateInterval');

          my $authority_code =
            root_text($doc, 'AuthorityCode');

          my $link_version =
            root_text($doc, 'LinkVersion');

          my @nodes =
            $doc->findnodes(
              '//*[local-name()="CCTV"]'
            );

          if (!@nodes) {
            die "XML 中找不到 CCTV 資料。\n";
          }

          my @cameras;
          my %seen;
          my $skipped = 0;

          for my $node (@nodes) {
            my $id =
              child_text($node, 'CCTVID');

            next if $id eq '';

            my $sub_authority =
              child_text($node, 'SubAuthorityCode');

            my $link_id =
              child_text($node, 'LinkID');

            my $video_url =
              child_text($node, 'VideoStreamURL');

            my $location_type =
              child_text($node, 'LocationType');

            my $lon_text =
              child_text($node, 'PositionLon');

            my $lat_text =
              child_text($node, 'PositionLat');

            my $road_id =
              child_text($node, 'RoadID');

            my $road_name =
              child_text($node, 'RoadName');

            my $road_class =
              child_text($node, 'RoadClass');

            my $direction =
              child_text($node, 'RoadDirection');

            my $start =
              nested_text(
                $node,
                'RoadSection',
                'Start'
              );

            my $end =
              nested_text(
                $node,
                'RoadSection',
                'End'
              );

            my $location_mile =
              child_text($node, 'LocationMile');

            my $valid_lon =
              $lon_text =~ /^-?(?:\d+(?:\.\d+)?|\.\d+)$/;

            my $valid_lat =
              $lat_text =~ /^-?(?:\d+(?:\.\d+)?|\.\d+)$/;

            if (
              !$valid_lon ||
              !$valid_lat ||
              $video_url eq ''
            ) {
              warn "略過資料不完整的 CCTV：$id\n";
              $skipped++;
              next;
            }

            my $lon = 0 + $lon_text;
            my $lat = 0 + $lat_text;

            if (
              $lon < 118 ||
              $lon > 123.5 ||
              $lat < 21 ||
              $lat > 26.5
            ) {
              warn "略過座標超出臺灣範圍的 CCTV：$id\n";
              $skipped++;
              next;
            }

            if ($seen{$id}++) {
              warn "略過重複 CCTV：$id\n";
              $skipped++;
              next;
            }

            my $name = build_name(
              $road_name,
              $direction,
              $location_mile,
              $start,
              $end,
              $id
            );

            push @cameras, {
              key              => "highway-$id",
              id               => $id,
              name             => $name,
              x                => $lon,
              y                => $lat,
              city             => '',
              district         => '',
              url              => $video_url,
              streamUrl        => $video_url,
              type             => 'highway',
              source           => '交通部高速公路局',
              subAuthorityCode => $sub_authority,
              linkId           => $link_id,
              locationType     => $location_type,
              roadId           => $road_id,
              roadName         => $road_name,
              roadClass        => $road_class,
              direction        => $direction,
              start            => $start,
              end              => $end,
              locationMile     => $location_mile
            };
          }

          @cameras = sort {
            $a->{id} cmp $b->{id}
          } @cameras;

          if (!@cameras) {
            die "轉換後沒有任何有效國道 CCTV。\n";
          }

          my $result = {
            metadata => {
              source               => '交通部高速公路局',
              sourceFile           => 'CCTV.xml',
              sourceUpdateTime     => $source_update_time,
              sourceUpdateInterval => $update_interval,
              authorityCode        => $authority_code,
              linkVersion          => $link_version,
              total                => scalar(@cameras),
              skipped              => $skipped
            },
            results => \@cameras
          };

          my $json = JSON::PP
            ->new
            ->utf8
            ->canonical
            ->pretty
            ->encode($result);

          open my $output, '>:raw', $output_file
            or die "無法建立 $output_file：$!\n";

          print {$output} $json;

          close $output
            or die "無法完成寫入 $output_file：$!\n";

          print "成功轉換 "
            . scalar(@cameras)
            . " 支國道 CCTV。\n";

          print "略過 $skipped 筆資料。\n";
          PERL

          perl /tmp/convert-freeway-cctv.pl

      - name: 驗證 freeway-cctv.json
        shell: bash
        run: |
          set -euo pipefail

          FILE="freeway-cctv.json.tmp"

          jq empty "$FILE"

          TOTAL="$(jq '.results | length' "$FILE")"
          META_TOTAL="$(jq '.metadata.total' "$FILE")"

          if [ "$TOTAL" -le 0 ]; then
            echo "錯誤：沒有任何國道 CCTV。"
            exit 1
          fi

          if [ "$TOTAL" -ne "$META_TOTAL" ]; then
            echo "錯誤：metadata.total 與實際數量不同。"
            exit 1
          fi

          INVALID_COUNT="$(
            jq '
              [
                .results[]
                | select(
                    (.key | type != "string" or length == 0) or
                    (.id | type != "string" or length == 0) or
                    (.name | type != "string" or length == 0) or
                    (.x | type != "number") or
                    (.y | type != "number") or
                    (.url | type != "string" or length == 0) or
                    (.type != "highway")
                  )
              ]
              | length
            ' "$FILE"
          )"

          if [ "$INVALID_COUNT" -ne 0 ]; then
            echo "錯誤：發現 $INVALID_COUNT 筆無效資料。"
            exit 1
          fi

          DUPLICATE_COUNT="$(
            jq '
              .results
              | group_by(.key)
              | map(select(length > 1))
              | length
            ' "$FILE"
          )"

          if [ "$DUPLICATE_COUNT" -ne 0 ]; then
            echo "錯誤：發現重複的 CCTV key。"
            exit 1
          fi

          echo "JSON 驗證成功，共 $TOTAL 支國道 CCTV。"

      - name: 更新正式 JSON
        shell: bash
        run: |
          set -euo pipefail

          mv \
            freeway-cctv.json.tmp \
            freeway-cctv.json

      - name: 顯示摘要
        shell: bash
        run: |
          set -euo pipefail

          echo "來源更新時間：$(jq -r '.metadata.sourceUpdateTime' freeway-cctv.json)"
          echo "國道 CCTV：$(jq -r '.metadata.total' freeway-cctv.json)"
          echo "略過資料：$(jq -r '.metadata.skipped' freeway-cctv.json)"

      - name: 提交 freeway-cctv.json
        shell: bash
        run: |
          set -euo pipefail

          git add freeway-cctv.json

          if git diff --cached --quiet; then
            echo "國道 CCTV JSON 沒有變更。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: 由本機 XML 更新國道 CCTV 資料"
          git push
