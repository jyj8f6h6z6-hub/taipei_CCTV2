<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>即時 CCTV 地圖</title>

  <meta
    name="description"
    content="整合各縣市道路、省道、國道、水利署與台北水情 CCTV 的即時影像地圖。"
  >

  <!-- 網站圖示、加入主畫面設定 -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="icon" href="./icons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./icons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CCTV 地圖">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- 提早連線到會用到的外部網站 -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Leaflet 地圖樣式 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <!-- 網站樣式 -->
  <link rel="stylesheet" href="style.css?v=2.3.0">
</head>

<body>

  <header>
    <div class="header-row">

      <h1>🗺 即時 CCTV 地圖 <span id="appVersion" class="app-version"></span></h1>

      <div class="controls">

        <!-- 搜尋 -->
        <div
          id="placeAutocomplete"
          aria-label="搜尋地址、車站、地標或店家"
        ></div>

        <!-- 縣市 -->
        <select id="cityFilter" aria-label="選擇縣市">
          <option value="全部">全部縣市</option>
        </select>

        <!-- 行政區 -->
        <select id="districtFilter" aria-label="選擇行政區">
          <option value="全部">全部行政區</option>
        </select>

        <!-- CCTV 類型（實際選項由 script.js 產生） -->
        <select id="sourceFilter" aria-label="選擇 CCTV 類型">
          <option value="all">全部 CCTV</option>
        </select>

        <button id="clearSearchBtn" type="button" hidden>
          ✕ 清除搜尋
        </button>

        <!-- 定位 -->
        <button id="locationBtn" type="button">
          📍 我的位置
        </button>

      </div>
    </div>

    <div class="status-bar" id="status" aria-live="polite">
      載入中……
    </div>
  </header>

  <main class="body">

    <aside class="sidebar" id="sidebar" aria-label="CCTV 清單"></aside>

    <div id="map" aria-label="即時 CCTV 地圖"></div>

  </main>

  <!-- 先載入 Leaflet -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- 再載入網站程式 -->
  <script src="script.js?v=2.3.0"></script>

</body>
</html>
